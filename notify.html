<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notify – Reminder App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      color: #f8fafc;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 36px;
    }

    /* ── Add form ── */
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 28px 32px;
      width: 100%;
      max-width: 520px;
      margin-bottom: 32px;
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    label {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    input[type="text"],
    input[type="date"],
    input[type="time"],
    textarea {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 0.95rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      border-color: #6366f1;
    }

    textarea {
      resize: vertical;
      min-height: 72px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-add {
      margin-top: 8px;
      width: 100%;
      padding: 12px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-add:hover { background: #4f46e5; }
    .btn-add:active { background: #4338ca; }

    /* ── Reminder list ── */
    #reminder-list {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-state {
      text-align: center;
      color: #475569;
      font-size: 0.9rem;
      padding: 24px 0;
    }

    .reminder-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      position: relative;
      transition: border-color 0.2s;
    }

    .reminder-item.fired {
      border-color: #6366f1;
      background: #1e1b4b;
    }

    .reminder-info { flex: 1; }

    .reminder-msg {
      font-size: 1rem;
      font-weight: 500;
      color: #f1f5f9;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .reminder-time {
      font-size: 0.8rem;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .reminder-time .badge {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .badge.upcoming { border-color: #6366f1; color: #a5b4fc; }
    .badge.past     { border-color: #334155; color: #475569; }
    .badge.due      { border-color: #f59e0b; color: #fbbf24; }

    .btn-remove {
      background: none;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #64748b;
      cursor: pointer;
      font-size: 1rem;
      padding: 5px 10px;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .btn-remove:hover {
      border-color: #ef4444;
      color: #ef4444;
      background: rgba(239,68,68,0.08);
    }

    /* ── Toast notification overlay ── */
    #toast-container {
      position: fixed;
      top: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 9999;
    }

    .toast {
      background: #1e1b4b;
      border: 1px solid #6366f1;
      border-radius: 14px;
      padding: 18px 22px;
      max-width: 340px;
      box-shadow: 0 8px 32px rgba(99,102,241,0.25);
      animation: slideIn 0.3s ease;
      position: relative;
    }

    .toast-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #818cf8;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .toast-msg {
      font-size: 1rem;
      font-weight: 500;
      color: #f1f5f9;
      margin-bottom: 6px;
    }

    .toast-time {
      font-size: 0.8rem;
      color: #6366f1;
    }

    .toast-close {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      color: #475569;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
    }

    .toast-close:hover { color: #f1f5f9; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(40px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideOut {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(40px); }
    }
  </style>
</head>
<body>

  <h1>🔔 Notify</h1>
  <p class="subtitle">Set reminders with a date &amp; time – they pop up right here.</p>

  <!-- Add reminder form -->
  <div class="card">
    <h2>New Reminder</h2>
    <div class="field">
      <label for="msg">Message</label>
      <textarea id="msg" placeholder="What do you want to be reminded about?"></textarea>
    </div>
    <div class="row">
      <div class="field">
        <label for="rdate">Date</label>
        <input type="date" id="rdate" />
      </div>
      <div class="field">
        <label for="rtime">Time</label>
        <input type="time" id="rtime" />
      </div>
    </div>
    <button class="btn-add" onclick="addReminder()">Add Reminder</button>
  </div>

  <!-- List -->
  <div id="reminder-list">
    <p class="empty-state">No reminders yet. Add one above.</p>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

<script>
  const STORAGE_KEY = 'notify_reminders';

  // Load from localStorage
  let reminders = (() => {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  })();

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(reminders));
  }

  function fmt(isoStr) {
    const d = new Date(isoStr);
    return d.toLocaleString(undefined, {
      weekday: 'short', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function statusBadge(isoStr) {
    const diff = new Date(isoStr) - Date.now();
    if (diff < -60000)  return { cls: 'past',     label: 'Past' };
    if (diff < 60000)   return { cls: 'due',      label: 'Due now' };
    return                     { cls: 'upcoming', label: 'Upcoming' };
  }

  function render() {
    const list = document.getElementById('reminder-list');
    if (reminders.length === 0) {
      list.innerHTML = '<p class="empty-state">No reminders yet. Add one above.</p>';
      return;
    }

    // Sort by datetime
    const sorted = [...reminders].sort((a, b) => new Date(a.at) - new Date(b.at));

    list.innerHTML = sorted.map(r => {
      const { cls, label } = statusBadge(r.at);
      return `
        <div class="reminder-item ${cls === 'due' ? 'fired' : ''}" id="ri-${r.id}">
          <div class="reminder-info">
            <div class="reminder-msg">${escHtml(r.msg)}</div>
            <div class="reminder-time">
              <span>${fmt(r.at)}</span>
              <span class="badge ${cls}">${label}</span>
            </div>
          </div>
          <button class="btn-remove" onclick="removeReminder('${r.id}')" title="Remove">✕</button>
        </div>`;
    }).join('');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function addReminder() {
    const msg   = document.getElementById('msg').value.trim();
    const rdate = document.getElementById('rdate').value;
    const rtime = document.getElementById('rtime').value;

    if (!msg)   { alert('Please enter a reminder message.'); return; }
    if (!rdate) { alert('Please pick a date.'); return; }
    if (!rtime) { alert('Please pick a time.'); return; }

    const at = new Date(`${rdate}T${rtime}`).toISOString();

    reminders.push({
      id:  crypto.randomUUID(),
      msg,
      at,
      fired: false
    });

    save();
    render();

    // Clear inputs
    document.getElementById('msg').value   = '';
    document.getElementById('rdate').value = '';
    document.getElementById('rtime').value = '';
  }

  function removeReminder(id) {
    reminders = reminders.filter(r => r.id !== id);
    save();
    render();
  }

  // ── Toast ──────────────────────────────────────────────────────────────
  function showToast(r) {
    const container = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = 'toast';
    el.id = 'toast-' + r.id;
    el.innerHTML = `
      <button class="toast-close" onclick="dismissToast('${r.id}')">✕</button>
      <div class="toast-title">Reminder</div>
      <div class="toast-msg">${escHtml(r.msg)}</div>
      <div class="toast-time">${fmt(r.at)}</div>`;
    container.appendChild(el);

    // Auto-dismiss after 10 s
    setTimeout(() => dismissToast(r.id), 10000);
  }

  function dismissToast(id) {
    const el = document.getElementById('toast-' + id);
    if (!el) return;
    el.style.animation = 'slideOut 0.3s ease forwards';
    setTimeout(() => el.remove(), 300);
  }

  // ── Polling loop ───────────────────────────────────────────────────────
  function checkReminders() {
    const now = Date.now();
    let changed = false;

    reminders.forEach(r => {
      if (r.fired) return;
      const due = new Date(r.at).getTime();
      if (now >= due) {
        r.fired = true;
        changed = true;
        showToast(r);
        // Browser notification if permission granted
        if (Notification.permission === 'granted') {
          new Notification('Notify – Reminder', { body: r.msg, icon: '' });
        }
      }
    });

    if (changed) { save(); render(); }
  }

  // Request browser notification permission on load
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }

  // ── Prefill today's date ───────────────────────────────────────────────
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('rdate').value = today;

  render();
  setInterval(checkReminders, 10000); // check every 10 s
  checkReminders();                   // immediate check on load
</script>
</body>
</html>
